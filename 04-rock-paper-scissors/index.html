<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rock Paper Scissors</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bangers&family=Bitcount+Grid+Double:wght@100..900&family=Black+Ops+One&family=Bona+Nova+SC:ital,wght@0,400;0,700;1,400&family=Playwrite+AU+TAS:wght@100..400&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <nav><h1 id="header">Rock Paper Scissor</h1></nav>
    <main>
        <div id="sign-container">
            <p class="gesture" id="rock">Rock</p>
            <p class="gesture" id="paper">Paper</p>
            <p class="gesture" id="scissors">Scissors</p>
        </div>
        <div id="count">
            <div class="user-score">
                <p id="player">0</p>
                <p>You</p>
            </div>
            <div class="comp-score">
                <p id="comp">0</p>
                <p>Computer</p>
            </div>
        </div>
        <div class="msg-container">
            <p id="msg">Play your move!</p>
        </div>
    </main>
    <script src="app.js"></script>
  </body>
</html>
